---
name: Lock

# yamllint disable-line rule:truthy
on:
  # Gives a Dependabot bump of this file a real run before merge.
  pull_request:
    paths:
      - .github/workflows/lock.yaml
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  workflows:
    uses: hassio-addons/workflows/.github/workflows/lock.yaml@c953d10f34dac22eb68c1cdedbbc4106a89bef88 # v3.0.1
