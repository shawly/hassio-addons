---
name: Sync labels

# yamllint disable-line rule:truthy
on:
  # Gives a Dependabot bump of this file a real run before merge.
  pull_request:
    paths:
      - .github/workflows/labels.yaml
  schedule:
    - cron: "34 5 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  workflows:
    uses: hassio-addons/workflows/.github/workflows/labels.yaml@adec4b96071354cc44924a6ef9975ff60cf9ddd9 # v5.0.0
